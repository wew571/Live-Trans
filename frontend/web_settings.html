/* Standalone settings prototype, using the supplied slider and effects. */
:root { color-scheme: dark; }
body { background: #101019; align-items: start; }
main { width: min(468px, 100%); margin: 18px auto; padding: 12px; }

.xm-win { overflow: hidden; --ink: #e9ecfa; --control: #216699; --edge: #477897; }
.xm-win[data-tier="u"] { --ink: #d9ddff; --control: #31376a; --edge: #6269ab; }
.xm-win[data-tier="x"] { --ink: #c5f9ca; --control: #24523e; --edge: #448960; }
.xm-win[data-tier="max"] { --ink: #ffdcaa; --control: #653822; --edge: #a65f36; }
.xm-title { margin: 0 0 14px; }
.xm-panel { padding: 0 0 7px; }
.xm-slider { width: 100%; height: 42px; }
.xm-fx { width: var(--fx-width, 372px); }
.xm-labels { margin: 0 -6px; gap: 0; }
.xm-labels button { padding: 0; font-size: clamp(10px, 3vw, 13px); }
.xm-specs { border-top: 1px solid rgba(var(--acc), .20); padding-top: 7px; }
.xm-name { margin-bottom: 1px; }
.xm-tok { cursor: default; }
.xm-tok:hover { box-shadow: none; }
.tier-text { color: var(--ink); transition: color 160ms ease; }
.xm-win:is([data-tier="u"],[data-tier="x"],[data-tier="max"]) {
  --shine: linear-gradient(95deg, #bdc9ff, #f3efff 36%, #cdbfff 67%, #bdc9ff);
}
.xm-win[data-tier="x"] { --shine: linear-gradient(95deg, #87e9a3, #f1fff1 36%, #c5ff9a 67%, #87e9a3); }
.xm-win[data-tier="max"] { --shine: linear-gradient(95deg, #ffbd83, #fff6d1 36%, #ffd587 67%, #ffbd83); }
.xm-win[data-tier] .tier-text {
  background: var(--shine) 0 50% / 190% 100%;
  background-clip: text;
}
.xm-win:is([data-tier="u"],[data-tier="x"],[data-tier="max"]) .tier-text {
  color: transparent;
  animation: text-sheen 5s ease-in-out infinite;
}
.xm-win[data-tier="x"] .tier-text { animation-duration: 4s; }
.xm-win[data-tier="max"] .tier-text { animation-duration: 3s; }
@keyframes text-sheen { 50% { background-position: 100% 50%; } }
.advanced { margin-top: 10px; }
.advanced summary { background: #303043; border-radius: 6px; padding: 6px 9px; cursor: pointer; font-size: 13px; }
.settings-form { display: grid; gap: 9px; margin-top: 10px; }
.field { display: grid; gap: 5px; font-size: 13px; }
.field select, .field input, .field textarea, .settings-action {
  width: 100%; min-width: 0; min-height: 28px; border-radius: 6px; color: #f2f3fa; font: inherit;
}
.field select, .settings-action { border: 1px solid var(--edge); background: var(--control); }
.field select { padding: 3px 8px; }
.field select:disabled { opacity: .8; }
.field input, .field textarea { padding: 4px 8px; border: 1px solid var(--edge); background: #20202e; }
.field textarea { resize: vertical; min-height: 144px; }
.field select option { background: #212135; color: #f2f3fa; }
.settings-action { padding: 4px 8px; cursor: pointer; font-size: 13px; }
.settings-action:hover, .settings-action:focus-visible { filter: brightness(1.16); }
.settings-subset { display: grid; gap: 9px; }
.settings-subset[hidden] { display: none; }
.rule-current, .settings-note { margin: 0; color: #bdc2d8; font-size: 13px; }
.settings-footer { display: grid; gap: 7px; margin-top: 11px; }
.animation-row { display:flex; align-items:center; justify-content:space-between; gap:12px; min-height:28px; padding:0 2px; cursor:pointer; }
.animation-row[hidden] { display:none; }
.interface-row { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:0 2px; margin-bottom:6px; }
.interface-row[hidden] { display:none; }
.interface-row select { flex:0 0 136px; padding:4px 8px; border:1px solid var(--edge); border-radius:6px; background:var(--control); color:#f2f3fa; font:inherit; }
.animation-row input { appearance:none; display:grid; align-items:center; width:32px; height:18px; margin:0; padding:2px; border:1px solid #626477; border-radius:10px; background:#3a3a4b; cursor:pointer; }
.animation-row input::before { content:""; width:12px; height:12px; border-radius:50%; background:white; }
.animation-row input:checked { background:#216699; border-color:#6496bd; justify-items:end; }
.animation-row input:focus-visible { outline:2px solid #a6c8ff; outline-offset:2px; }
.xm-win[data-animation="off"] .xm-box { border-color:transparent !important; }
.xm-win[data-animation="off"] .xm-slider { height:36px; }
.xm-win[data-animation="off"] :is(.xm-track, .xm-dot) { margin-top:-6px; }
.xm-win[data-animation="off"] .xm-knob { top:18px; }
.xm-win[data-animation="off"] .xm-specs { border:0; }
.xm-win[data-animation="off"] :is(.xm-sky, .xm-bolts, .xm-fx, .xm-ahead, .xm-outline, .xm-contact, .xm-wave, .xm-glow, .xm-core, .xm-box-glow, .xm-crys, .xm-name:not(.is-custom)) { display:none; }
.xm-win[data-animation="off"] .tier-text { transition:none; }
@media (max-width: 420px) {
  main { margin: 0 auto; padding: 8px; }
  .xm-win { padding: 13px; }
  .xm-box { padding-inline: 9px; }
}
@media (prefers-reduced-motion: reduce) {
  .xm-win[data-tier] .tier-text { animation: none; }
}
body { display:block; overflow:auto; } main { width:min(468px, 100%); margin:0 auto; } .xm-stage { overflow:visible; } .xm-win { margin:0; }

      slider.setAttribute('aria-valuenow', st.index); slider.setAttribute('aria-valuetext', preset ? preset.name : T.custom);
      const tok = (key, text) => {
        const cls = `xm-tok${pickU.has(key) ? ' on-u' : ''}${pickX.has(key) ? ' on-x' : ''}`;
        return `<span class="${cls}" data-key="${key}" data-choice="tok-${key}">${text}</span>${crystals.has(key) ? CRYS : ''}`;
      };
      const line = (role, parts, sep) => parts.map((text, i) => tok(`${role}:${i}`, text)).join(sep);
      nameEl.innerHTML = tok('name', preset ? preset.name : T.custom);
      nameEl.classList.toggle('is-custom', !preset);
      ocrEl.innerHTML = line('ocr', ocr, ' · ');
      modelEl.innerHTML = line('model', model, hasQwen() ? ' ' : ' → ');
      routeEl.innerHTML = line('route', [hasQwen() ? T.direct : T.pivot], ' · ');
    }

    let nextStorm = 0;
    function storm(t) {
      const bolts = $('.xm-bolts');
      bolts.replaceChildren();
      const count = Math.random() < .5 ? 3 : 4;
      for (let i = 0; i < count; i++) {
        const path = document.createElementNS('http://www.w3.org/2000/svg','path');
        let x = (i + Math.random()) * 400 / count;
        const points = [`M ${x} 0`];
        for (let y = 8; y < 100; y += R(7,16)) {
          x += R(-15,12); points.push(`L ${x} ${y}`);
        }
        path.setAttribute('d',points.join(' ')); path.setAttribute('fill','none');
        path.setAttribute('stroke','#ffebbb'); path.setAttribute('stroke-width','1.4');
        path.style.filter='drop-shadow(0 0 3px #ffa239)'; path.style.opacity=0;
        bolts.append(path);
        path.animate([{opacity:0},{opacity:.95,offset:.1},{opacity:.26,offset:.45},{opacity:0}],{duration:220*S(),delay:i*65*S()});
      }
      nextStorm=t+R(3000,5000)*S();
    }
    function commit(index) {
      const old = st.index;
      if (index === old) return;
      st.index = index;
      if(index===LAST || old===LAST){
        tween('gold',index===LAST?1:0,index===LAST?140:250);
        nextStorm=now()+R(3000,5000)*S();
        if(old===LAST){$('.xm-bolts').replaceChildren();setNow('tension',0);}
      }
      renderSpecs();
      if (old >= ULTRA && index < ULTRA) { tween('eU', 0, 300); st.armed = false; }
      if (old < ULTRA && index >= ULTRA) tween('eU', 1, 200);
      if (old >= EXTREME && index < EXTREME) { tween('eX', 0, 250); tween('crys', 0, 200); st.armed = false; }
      if (old < EXTREME && index >= EXTREME) { tween('eX', 1, 200); tween('crys', 1, 260, easeOutBack); st.shim = 0; }
    }

    function flashName(color) {
      nameEl.animate([
        { filter: 'brightness(1.7)', textShadow: `0 0 12px rgb(${color}), 0 0 3px #fff` },
        { filter: 'brightness(1)', textShadow: `0 0 0 rgba(${color},0)` },
      ], { duration: 320 * S(), easing: 'ease-out' });
    }

    function ignite(gate) {
      setNow('eU', 1);
      if(gate===LAST){st.shim=-300;return flashName(csv(GOLD));}
      if (gate !== EXTREME) return flashName(csv(NEB.acc));
      setNow('eX', 1);
      st.crys = 0;
      tween('crys', 1, 260, easeOutBack);
      st.shim = -300;
      flashName(csv(JADE.acc));
    }

    function arrive(gate) {
      if(gate===LAST){
        thumb.animate([{transform:'scale(1.25)'},{transform:'scale(.94)',offset:.55},{transform:'scale(1)'}],{duration:230*S()});
        box.animate([0,3,-3,1,0].map(x=>({transform:`translateX(${x}px)`})),{duration:150*S()});
        for(const [i,color] of ['#ff643c','#ffeaaa'].entries()){
          const ring=wave.cloneNode(); slider.append(ring);
          Object.assign(ring.style,{left:((START+SEG*gate)/W*100)+'%',borderColor:color,boxShadow:'0 0 6px '+color});
          ring.animate([{width:'24px',height:'24px',opacity:.95},{width:'740px',height:'68px',opacity:0}],{duration:470*S(),delay:i*90*S()}).onfinish=()=>ring.remove();
        }
        return;
      }
      const extreme = gate === EXTREME;
      thumb.animate(extreme
        ? [{ transform: 'scale(1.18)' }, { transform: 'scale(.97)', offset: .7 }, { transform: 'scale(1)' }]
        : [{ transform: 'scale(1.12)' }, { transform: 'scale(1)' }],
      { duration: (extreme ? 140 : 120) * S(), easing: 'ease-out' });
      wave.style.left = `${(START + SEG * gate) / W * 100}%`;
      wave.style.setProperty('--wave', csv((extreme ? JADE : NEB).acc));
      wave.animate(extreme ? [
        { width: '26px', height: '26px', opacity: 1, borderWidth: '2.5px' },
        { width: '64px', height: '44px', opacity: 0, borderWidth: '1px' },
      ] : [
        { width: '26px', height: '26px', opacity: .95, borderWidth: '2px' },
        { width: '46px', height: '46px', opacity: 0, borderWidth: '1px' },
      ], { duration: (extreme ? 240 : 200) * S(), easing: 'cubic-bezier(.2,.7,.3,1)' });
    }

    function unlock(gate) {
      commit(gate);
      ignite(gate);
      tween('tension', 0, 150);
      st.mode = 'hold';
      moveTo(gate, 90, easeOutCubic, () => arrive(gate));
    }

    function zoneGate() {
      const gate = gateAbove(st.index);
      return gate && st.armed && st.u > gate - .7 && st.u < gate - (gate === LAST ? .1 : .3) ? gate : 0;
    }

    function handleMove(u, press) {
      if (!animation.checked) {
        const index = Math.round(u);
        if (press || index !== st.index) select(index);
        st.dragging = true;
        return;
      }
      st.u = u;
      const gate = gateAbove(st.index);
      if (gate && u <= gate - .7) st.armed = true;
      if (gate && u >= gate - (gate === LAST ? .1 : .3)) {
        const next = Math.round(u);
        if (next === gate) return unlock(gate);
        commit(next);
      } else {
        commit(gate ? Math.min(gate - 1, Math.round(u)) : Math.round(u));
      }
      let target = u, mode = 'free';
      const zone = zoneGate();
      if (zone) {
        const depth = u - (zone - .7), t = depth / (zone === LAST ? .6 : .4);
        setNow('tension', t);
        st.tGate = zone;
        const lag = zone === LAST ? 4 + 2*t : zone === EXTREME ? 3 + t : 2.5;
        target = u - clamp(depth / .05) * lag / SEG;
        mode = 'zone';
      } else {
        if (!st.tweens.tension) st.tension = 0;
        if (GATES.includes(st.index) && Math.abs(u - st.index) <= .3) { target = st.index; mode = 'hold'; }
      }
      retarget(target, press || mode !== st.mode);
      st.mode = mode;
    }

    function release() {
      st.dragging = false;
      if (!animation.checked) return;
      const zone = zoneGate();
      if (zone) {
        st.springBack = zone - 1;
        tween('tension', 0, 260);
        moveTo(zone - 1, 260, easeOutBack, () => { st.springBack = null; });
      } else if (st.anim) {
        st.target = st.index;
      } else {
        moveTo(st.index, 120);
      }
    }

    function select(index) {
      index = clamp(index, 0, LAST);
      if (index === st.index) { renderSpecs(); return; }
      if (!animation.checked) { reset(index); return; }
      const old = st.index;
      commit(index);
      if (GATES.includes(index) && old < index) {
        ignite(index);
        moveTo(index, 120, easeOutCubic, () => arrive(index));
      } else {
        moveTo(index, 120);
      }
    }

    function reset(index, apply = true) {
      Object.assign(st, {
        gold: index===LAST ? 1 : 0, index, display: index, target: index, anim: null, dragging: false, u: index, armed: true,
        springBack: null, tension: 0, tGate: 0, tweens: {}, mode: null,
        eU: index >= ULTRA ? 1 : 0, eX: index >= EXTREME ? 1 : 0, crys: index >= EXTREME ? 1 : 0,
        boxBase: (index < HIGH ? BORDER_LOW : BORDER_HIGH).slice(), breath: 0, shim: 0,
      });
      if (apply) renderSpecs(); else renderSummary();
      if (!animation.checked) renderStatic();
    }

    function drawFx(uLevel, xLevel, fillWidth) {
      g.clearRect(0, 0, GW, TH);
      if (uLevel > .001) {
        g.globalAlpha = uLevel;
        tiled(g, nebula ??= makeNebula(), driftN);
        g.globalAlpha = 1;
        sparks(g, SPARKS_N, driftN, uLevel, PAL_N);
      }
      if (xLevel > .001) {
        g.globalAlpha = xLevel;
        tiled(g, auroraBase ??= makeAuroraBase(), driftA);
        tiled(g, auroraRibbons ??= makeAuroraRibbons(), driftR);
        g.globalAlpha = 1;
        sparks(g, SPARKS_A, driftR, xLevel, PAL_A);
      }
      const heat = Math.max(st.gold, st.tGate===LAST ? st.tension : 0);
      if(heat && sky.naturalWidth){
        g.save(); g.globalAlpha=heat;
        const w=144, offset=driftA%(2*w);
        for(let i=-2;i<4;i++){
          g.save();g.translate(i*w+offset+(i%2?w:0),0);g.scale(i%2?-1:1,1);
          g.drawImage(sky,0,0,w,TH);g.restore();
        }
        g.restore();
        sparks(g,SPARKS_A,driftR,heat,['rgba(255,190,96,.5)','rgba(255,150,0,0)','#fff4be']);
      }
      const period = st.index===LAST ? 7200 : 2200;
      if (st.index < EXTREME || st.shim < 0) return;
      const k = (st.shim % period) / period, travel = .78;
      if (k >= travel) return;
      const x = -40 + (fillWidth + 80) * (k / travel);
      g.save();
      g.translate(x, 0);
      g.transform(1, 0, -.6, 1, 0, 0);
      const streak = g.createLinearGradient(-30, 0, 30, 0);
      streak.addColorStop(0, 'rgba(210,255,200,0)');
      streak.addColorStop(.5, 'rgba(232,255,220,.6)');
      streak.addColorStop(1, 'rgba(210,255,200,0)');
      g.globalCompositeOperation = 'screen';
      g.fillStyle = streak;
      g.fillRect(-30, 0, 60 + TH, TH);
      g.restore();
    }

    function update(t, dt) {
      for (const [key, tw] of Object.entries(st.tweens)) {
        const k = clamp((t - tw.start) / tw.dur);
        st[key] = tw.from + (tw.to - tw.from) * tw.ease(k);
        if (k >= 1) delete st.tweens[key];
      }
      if (st.anim) {
        const a = st.anim, k = clamp((t - a.start) / a.dur);
        st.display = a.from + (st.target - a.from) * a.ease(k);
        if (k >= 1) { st.anim = null; st.display = st.target; if (a.done) a.done(); }
      } else {
        st.display = st.target;
      }
      st.boxBase = mix(st.boxBase, st.index < HIGH ? BORDER_LOW : BORDER_HIGH, 1 - Math.exp(-dt / (60 * S())));
      st.breath = (st.breath + dt / ((2000 - 500 * clamp(st.eX) - 500*st.gold) * S())) % 1;
      if(st.index===LAST && t>=nextStorm) storm(t);
      if (st.index >= EXTREME) st.shim += dt / S();
    }

    let sliderWidth = slider.clientWidth;
    new ResizeObserver(() => {
      sliderWidth = slider.clientWidth;
      slider.style.setProperty('--fx-width', Math.max(0, sliderWidth - 2) + 'px');
      if (!animation.checked) renderStatic();
    }).observe(slider);
    function paintButtons(selectedColor) {
      buttons.forEach((button, i) => {
        const selected = i === st.index;
        button.style.background = selected ? selectedColor : '';
        button.setAttribute('aria-pressed', String(selected));
      });
    }
    function renderStatic() {
      const x = (START + SEG * st.index) / W * sliderWidth;
      win.dataset.tier = 'base';
      knob.style.transform = `translateX(${x}px)`;
      fill.style.width = `${st.index / LAST * 100}%`;
      fill.style.background = '#3b82f6';
      $('.xm-track').style.transform = '';
      nameEl.style.color = '';
      paintButtons(rgb(SEL_BLUE));
    }
    function render() {
      const p = st.display, x = (START + SEG * p) / W * sliderWidth;
      const theme = { acc: mix(NEB.acc, JADE.acc, clamp(st.eX)), sel: mix(NEB.sel, JADE.sel, clamp(st.eX)), name: mix(NEB.name, JADE.name, clamp(st.eX)) };
      const tensionGold=st.tGate===LAST?st.tension:0;
      const heat=Math.max(st.gold,tensionGold);
      theme.acc=mix(theme.acc,GOLD,heat);theme.sel=mix(theme.sel,[139,60,27],st.gold);
      $('.xm-sky').style.opacity=st.gold;
      $('.xm-track').style.transformOrigin='left center';
      $('.xm-track').style.transform='scaleX('+(1+.008*tensionGold)+')';
      win.style.setProperty('--acc', csv(theme.acc));
      win.dataset.tier = st.index === LAST ? 'max' : st.index >= EXTREME ? 'x' : st.index >= ULTRA ? 'u' : 'base';
      knob.style.transform = `translateX(${x}px)`;
      const fillWidth = (W - 2) * clamp(p / 5);
      fill.style.width = `${clamp(p / 5) * 100}%`;
      fill.style.background = rgb(p <= HIGH ? mix(BLUE, INDIGO, clamp(p - 1)) : INDIGO);
      const zoneU = st.tGate === ULTRA ? st.tension : 0, zoneX = st.tGate === EXTREME ? st.tension : 0;
      const uLevel = p >= ULTRA ? 1 : Math.max(zoneU, st.eU), xLevel = clamp(Math.max(zoneX, st.eX));
      if (uLevel > .001 || xLevel > .001) drawFx(uLevel, xLevel, fillWidth); else g.clearRect(0, 0, GW, TH);

      slider.style.setProperty('--heat', csv(st.tGate === LAST ? GOLD : st.tGate === EXTREME ? JADE.acc : NEB.acc));
      contact.style.opacity = st.tension;
      contact.style.transform = `translateX(${x}px) scale(${0.6 + 0.5 * st.tension})`;
      ahead.style.opacity = zoneX;
      ahead.style.transform = `translateX(${x + 6}px)`;
      outline.style.opacity = st.tension * 0.9;
      const amp = st.tGate === LAST ? 1+1.5*tensionGold : st.tGate === EXTREME ? 1 : .5;
      const jitter = () => (st.tension > .01 ? (Math.random() < .5 ? -amp : amp) : 0);
      outline.style.transform = `translate(${jitter()}px, ${jitter()}px)`;

      const breathing = st.index >= ULTRA && !st.dragging;
      const b = 0.5 - 0.5 * Math.cos(2 * Math.PI * st.breath);
      const pulse = breathing ? 0.3 + 0.7 * b : 0.75;
      glow.style.opacity = st.eU; glowI.style.opacity = pulse;
      boxGlow.style.opacity = st.eU; boxGlowI.style.opacity = pulse;
      core.style.opacity = clamp(st.eX) * (breathing ? 0.7 + 0.3 * b : 1);
      box.style.borderColor = rgb(mix(st.boxBase, theme.acc, st.eU));
      box.style.setProperty('--tok-hide', 1 - st.eU);
      box.style.setProperty('--tok-pos', `${driftN * 0.5}px`);
      box.style.setProperty('--crys', Math.max(0, st.crys).toFixed(3));
      box.style.setProperty('--crys-glow', (breathing ? b : .5).toFixed(3));
      nameEl.style.color = rgb(mix(NAME, theme.name, st.eU));
      paintButtons(rgb(st.index < HIGH ? SEL_BLUE : mix(SEL_HIGH, theme.sel, st.eU)));

    }

    const uAt = e => {
      const rect = slider.getBoundingClientRect();
      return clamp(((e.clientX - rect.left) / rect.width * W - START) / SEG, 0, 5);
    };
    slider.addEventListener('pointerdown', e => {
      if (e.button !== 0) return;
      e.preventDefault();
      slider.setPointerCapture(e.pointerId);
      slider.focus({ preventScroll: true });
      Object.assign(st, { dragging: true, armed: true, springBack: null, mode: null });
      handleMove(uAt(e), true);
    });
    slider.addEventListener('pointermove', e => { if (st.dragging) handleMove(uAt(e), false); });
    ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(type =>
      slider.addEventListener(type, () => { if (st.dragging) release(); }));
    slider.addEventListener('keydown', e => {
      const next = { ArrowLeft: st.index - 1, ArrowRight: st.index + 1, Home: 0, End: LAST }[e.key];
      if (next === undefined) return;
      e.preventDefault();
      select(next);
    });
    buttons.forEach((button, i) => button.addEventListener('click', () => select(i)));

    reset(0, false); nextStorm=now()+R(3000,5000);
    if (window.pywebview && window.pywebview.api) bootstrap(); else window.addEventListener('pywebviewready', bootstrap, {once:true});

    return { update, render, animated: () => animation.checked };
  }

  const dialogs = [...document.querySelectorAll('.xm-dialog')].map(createDialog);
  let last = performance.now();
  let raf=0;
  function refresh(){
    cancelAnimationFrame(raf);
    document.querySelectorAll('.xm-bolts').forEach(node=>node.replaceChildren());
    if(!document.hidden && dialogs.some(dialog => dialog.animated())) {
      last=performance.now();raf=requestAnimationFrame(frame);
    }
  }
  document.addEventListener('visibilitychange',refresh);
  function frame(t) {
    const dt = clamp(t - last, 0, 100);
    last = t;
    {
      driftN += dt / 1000 * 16 / S();
      driftA += dt / 1000 * 20 / S();
      driftR += dt / 1000 * 30 / S();
      twinkle += dt / S();
    }
    dialogs.filter(d => d.animated()).forEach(d => { d.update(t, dt); d.render(); });
    raf=requestAnimationFrame(frame);
  }
  refresh();
})();
</script>
</html>
